name: Instalar Godot
description: Descarga Godot para Linux (con caché) y lo deja en el PATH como `godot`.

inputs:
  version:
    description: Versión estable de Godot (la misma que usa el equipo).
    default: "4.7.2"

runs:
  using: composite
  steps:
    - name: Caché de Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ inputs.version }}-linux

    - name: Descargar Godot ${{ inputs.version }}
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot
        curl -fsSL -o /tmp/godot.zip \
          "https://github.com/godotengine/godot/releases/download/${{ inputs.version }}-stable/Godot_v${{ inputs.version }}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot
        mv ~/godot/Godot_v${{ inputs.version }}-stable_linux.x86_64 ~/godot/godot

    - name: Poner Godot en el PATH
      shell: bash
      run: |
        echo "$HOME/godot" >> "$GITHUB_PATH"
        "$HOME/godot/godot" --version
